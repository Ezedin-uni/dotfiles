import = [
    "~/.config/alacritty/themes/themes/catppuccin.toml"
]

live_config_reload = true
[ env ]
TERM = "xterm-256color"
[window]
padding.x = 10
padding.y = 0
decorations = "none"
dynamic_padding = false
opacity = 0.9
blur=true
